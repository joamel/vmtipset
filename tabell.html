const MONTHS = {januari:0,februari:1,mars:2,april:3,maj:4,juni:5,juli:6,augusti:7,september:8,oktober:9,november:10,december:11};

function matchStartUtc(m) {
    const p = m.d.split(' ');
    const [h, min] = m.t.split('.').map(Number);
    return Date.UTC(2026, MONTHS[p[2]], parseInt(p[1]), h - 2, min || 0);
}

function outcome(h, a) { return h > a ? 'H' : a > h ? 'A' : 'D'; }

function calcPoints(tipH, tipA, resH, resA) {
    if (tipH === resH && tipA === resA) return 25;
    const diffH = Math.abs(tipH - resH);
    const diffA = Math.abs(tipA - resA);
    const correct = outcome(tipH, tipA) === outcome(resH, resA);
    return Math.max(0, correct ? 20 - diffH - diffA : 10 - diffH - diffA);
}

let RESULTS = [];
let KUPONGER = [];
let resultsReady = false;
let kupongerReady = false;

function getTip(tips, i) {
    const t = tips?.[i];
    if (!t) return null;
    const h = typeof t === 'object' ? t.h : t[0];
    const a = typeof t === 'object' ? t.a : t[1];
    if (h === '' || h == null || a === '' || a == null) return null;
    return { h: parseInt(h), a: parseInt(a) };
}

function calcStats(tips) {
    let pts = 0, exact = 0, correct = 0, wrong = 0;
    RESULTS.forEach((res, i) => {
        if (!res || res.status !== 'FINISHED' || res.h == null) return;
        const tip = getTip(tips, i);
        if (!tip || isNaN(tip.h) || isNaN(tip.a)) return;
        const p = calcPoints(tip.h, tip.a, res.h, res.a);
        pts += p;
        if (tip.h === res.h && tip.a === res.a) exact++;
        else if (outcome(tip.h, tip.a) === outcome(res.h, res.a)) correct++;
        else wrong++;
    });
    return { pts, exact, correct, wrong };
}

function getNextMatches(n) {
    return M.map((m, i) => ({ m, i }))
        .filter(({ i }) => { const r = RESULTS[i]; return !r || r.status !== 'FINISHED'; })
        .sort((a, b) => matchStartUtc(a.m) - matchStartUtc(b.m))
        .slice(0, n);
}

function renderTable() {
    const loading = document.getElementById('loading');
    const noData  = document.getElementById('no-data');
    const wrap    = document.getElementById('table-wrap');

    if (!KUPONGER.length) {
        loading.style.display = 'none';
        noData.style.display = 'block';
        wrap.style.display = 'none';
        return;
    }

    loading.style.display = 'none';
    noData.style.display = 'none';
    wrap.style.display = '';

    const NM = 3;
    const nextMatches = getNextMatches(NM);

    // ── Header ──
    const thead = document.getElementById('thead');
    const nextMainHdrs = nextMatches.map((_, j) =>
        `<th class="th-next-grp"${j > 0 ? '' : ''}>Nästa match ${j + 1}</th>`
    ).join('');
    const nextSubHdrs = nextMatches.map(({ m }) =>
        `<th class="th-next-grp" style="font-weight:500;opacity:.8">${m.h} – ${m.b}</th>`
    ).join('');

    thead.innerHTML = `
        <tr>
            <th class="col-rank">#</th>
            <th class="col-alias">Alias</th>
            <th>Poäng</th>
            <th>Exakt</th>
            <th>Rätt</th>
            <th class="col-exact">Fel</th>
            ${nextMainHdrs}
        </tr>
        <tr class="sub-hdr">
            <th class="col-rank"></th>
            <th class="col-alias"></th>
            <th></th>
            <th></th>
            <th></th>
            <th class="col-exact"></th>
            ${nextSubHdrs}
        </tr>`;

    // ── Rows ──
    const rows = KUPONGER.map(k => {
        const alias = k.alias || k.namn || k.label || 'Namnlös';
        const stats = calcStats(k.tips || []);
        return { alias, ...stats, tips: k.tips || [] };
    }).sort((a, b) => b.pts - a.pts || b.exact - a.exact || b.correct - a.correct);

    let rank = 0, prevKey = null;
    tbody.innerHTML = rows.map((r, idx) => {
        const key = r.pts + '|' + r.exact;
        if (key !== prevKey) { rank = idx + 1; prevKey = key; }
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
        const rankDisp = medal
            ? `<span class="rank-medal">${medal}</span>`
            : `<span class="rank-num">${rank}</span>`;

        const nextCols = nextMatches.map(({ i }, j) => {
            const tip = getTip(r.tips, i);
            const cls = 'col-next' + (j === 0 ? ' col-next-grp' : '');
            return tip
                ? `<td class="${cls}">${tip.h}–${tip.a}</td>`
                : `<td class="${cls} col-next-empty">–</td>`;
        }).join('');

        return `<tr>
            <td class="col-rank">${rankDisp}</td>
            <td class="col-alias">${escHtml(r.alias)}</td>
            <td class="col-pts">${r.pts}</td>
            <td class="col-stat">${r.exact}</td>
            <td class="col-stat">${r.correct}</td>
            <td class="col-stat col-wrong">${r.wrong}</td>
            ${nextCols}
        </tr>`;
    }).join('');

    const now = new Date().toLocaleString('sv-SE', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('updated-at').textContent = `Uppdaterat ${now}`;
}

function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

db.collection('meta').doc('results').onSnapshot(snap => {
    RESULTS = snap.exists ? (snap.data().results || []) : [];
    resultsReady = true;
    if (kupongerReady) renderTable();
});

db.collection('kuponger').onSnapshot(snap => {
    KUPONGER = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    kupongerReady = true;
    if (resultsReady) renderTable();
});
