<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003087">
    <title>VM 2026 – Tabell</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1a1a1a; }

        header { background: #003087; color: #fff; padding: 13px 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
        .hd { display: flex; align-items: center; gap: 10px; }
        header h1 { font-size: 1.05rem; font-weight: 700; }
        .hs { font-size: .72rem; opacity: .7; margin-top: 1px; }
        .back-btn { background: rgba(255,255,255,.15); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: .8rem; text-decoration: none; display: inline-block; white-space: nowrap; }

        .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 10px 40px; }

        .comment-box { background: #fff8e1; border-left: 3px solid #f59e0b; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: .9rem; color: #7a5c00; font-weight: 500; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        table { width: 100%; border-collapse: collapse; font-size: .88rem; }

        thead tr:first-child th {
            background: #003087; color: #fff;
            padding: 10px 10px 5px;
            font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
            white-space: nowrap;
            border-right: 1px solid rgba(255,255,255,.08);
        }
        thead tr:first-child th:last-child { border-right: none; }
        thead tr.sub-hdr th {
            background: #1a4a9e; color: rgba(255,255,255,.85);
            font-size: .63rem; font-weight: 500;
            padding: 3px 10px 8px;
            border-right: 1px solid rgba(255,255,255,.08);
        }
        thead tr.sub-hdr th:last-child { border-right: none; }
        .th-next { border-left: 2px solid rgba(255,255,255,.15) !important; }

        tbody tr { border-bottom: 1px solid #f2f2f2; transition: background .1s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #f6f8ff; }

        td { padding: 9px 10px; text-align: center; vertical-align: middle; }

        .col-rank { width: 38px; position: sticky; left: 0; background: inherit; z-index: 1; }
        thead th.col-rank { background: #003087; z-index: 2; }
        thead tr.sub-hdr th.col-rank { background: #1a4a9e; }

        .col-alias { text-align: left; position: sticky; left: 38px; background: inherit; z-index: 1; min-width: 120px; max-width: 180px; font-weight: 600; font-size: .9rem; border-right: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        thead th.col-alias { background: #003087; z-index: 2; border-right: 1px solid rgba(255,255,255,.08); }
        thead tr.sub-hdr th.col-alias { background: #1a4a9e; }

        .col-pts { font-weight: 700; font-size: 1rem; color: #003087; min-width: 58px; border-right: 1px solid #f0f0f0; }
        .col-stat { color: #555; font-size: .82rem; min-width: 44px; }
        .col-wrong { border-right: 2px solid #e8edf5; }

        .col-next { min-width: 72px; font-size: .85rem; font-weight: 600; border-left: 2px solid #e8edf5; }
        .col-next-empty { color: #ccc; font-weight: 400; }

        .rank-medal { font-size: 1.1rem; line-height: 1; }
        .rank-num { font-size: .8rem; color: #999; font-weight: 700; }

        #loading { text-align: center; padding: 50px; color: #999; font-size: .9rem; }
        #no-data { display: none; text-align: center; padding: 40px; color: #aaa; font-size: .9rem; }
    </style>
</head>
<body>

<header>
    <div class="hd">
        <span style="font-size:1.6rem;line-height:1">⚽</span>
        <div>
            <h1>VM 2026 – Tabell</h1>
            <div class="hs" id="updated-at">Laddar...</div>
        </div>
    </div>
    <a href="../" class="back-btn">← Tillbaka</a>
</header>

<div class="wrap">
    <div id="comment-wrap" style="display:none">
        <div class="comment-box" id="comment-box"></div>
    </div>
    <div class="card">
        <div id="loading">Laddar tabell...</div>
        <div id="no-data">Ingen tabell publicerad ännu.<br><span style="font-size:.8rem">Admin kan publicera tabellen från adminläget.</span></div>
        <div class="table-wrap" id="table-wrap" style="display:none">
            <table id="tbl">
                <thead id="thead"></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const FB = {
    apiKey:            "AIzaSyDAHF8OHv67aCk8uC15jjGDKfns7a7woec",
    authDomain:        "vmtipset-59e38.firebaseapp.com",
    projectId:         "vmtipset-59e38",
    storageBucket:     "vmtipset-59e38.firebasestorage.app",
    messagingSenderId: "475538731303",
    appId:             "1:475538731303:web:a2a9a307d52b252b47f902"
};
firebase.initializeApp(FB);
const db = firebase.firestore();

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderTable(data) {
    const loading  = document.getElementById('loading');
    const noData   = document.getElementById('no-data');
    const wrap     = document.getElementById('table-wrap');
    const commentWrap = document.getElementById('comment-wrap');
    const commentBox  = document.getElementById('comment-box');

    if (!data || !data.rows || !data.rows.length) {
        loading.style.display = 'none';
        noData.style.display = 'block';
        wrap.style.display = 'none';
        commentWrap.style.display = 'none';
        return;
    }

    loading.style.display = 'none';
    noData.style.display = 'none';
    wrap.style.display = '';

    if (data.comment) {
        commentBox.textContent = '💬 ' + data.comment;
        commentWrap.style.display = 'block';
    } else {
        commentWrap.style.display = 'none';
    }

    const nextMatches = data.nextMatches || [];

    // ── Header ──
    const thead = document.getElementById('thead');
    const nextMainHdrs = nextMatches.map((_, j) =>
        `<th class="th-next">Nästa match ${j + 1}</th>`
    ).join('');
    const nextSubHdrs = nextMatches.map(nm =>
        `<th class="th-next" style="font-weight:400;opacity:.75">${escHtml(nm.label)}</th>`
    ).join('');

    thead.innerHTML = `
        <tr>
            <th class="col-rank">#</th>
            <th class="col-alias">Alias</th>
            <th>Poäng</th>
            <th>Exakt</th>
            <th>Rätt</th>
            <th class="col-wrong">Fel</th>
            ${nextMainHdrs}
        </tr>
        <tr class="sub-hdr">
            <th class="col-rank"></th>
            <th class="col-alias"></th>
            <th></th><th></th><th></th>
            <th class="col-wrong"></th>
            ${nextSubHdrs}
        </tr>`;

    // ── Rows ──
    let rank = 0, prevKey = null;
    document.getElementById('tbody').innerHTML = data.rows.map((r, idx) => {
        const key = r.pts + '|' + r.exact;
        if (key !== prevKey) { rank = idx + 1; prevKey = key; }
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';
        const rankDisp = medal
            ? `<span class="rank-medal">${medal}</span>`
            : `<span class="rank-num">${rank}</span>`;

        const nextCols = (r.nextTips || []).map((tip, j) =>
            tip && tip !== '–'
                ? `<td class="col-next">${escHtml(tip)}</td>`
                : `<td class="col-next col-next-empty">–</td>`
        ).join('');

        return `<tr>
            <td class="col-rank">${rankDisp}</td>
            <td class="col-alias">${escHtml(r.alias)}</td>
            <td class="col-pts">${r.pts}</td>
            <td class="col-stat">${r.exact}</td>
            <td class="col-stat">${r.correct}</td>
            <td class="col-stat col-wrong">${r.wrong}</td>
            ${nextCols}
        </tr>`;
    }).join('');

    if (data.updatedAt) {
        const d = new Date(data.updatedAt).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' });
        document.getElementById('updated-at').textContent = 'Uppdaterad ' + d;
    }
}

const DEFAULT_GROUP = 'joakim';
const _params = new URLSearchParams(location.search);
const _g = _params.get('g') || null;

function metaDoc(name) {
    return db.collection('groups').doc(_g || DEFAULT_GROUP).collection('meta').doc(name);
}

// Back link: go back to admin if that's where we came from, otherwise public
const backLink = document.querySelector('a.back-btn');
const _from = _params.get('from');
if (_from === 'admin') {
    backLink.href = '../admin/' + (_g ? '?g=' + encodeURIComponent(_g) : '');
} else if (_g) {
    backLink.href = '../?g=' + encodeURIComponent(_g);
}

metaDoc('tabell').onSnapshot(snap => {
    renderTable(snap.exists ? snap.data() : null);
}, () => {
    document.getElementById('loading').textContent = 'Kunde inte ladda tabellen.';
});
</script>
</body>
</html>
