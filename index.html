function teamMatches(a,s){if(!a||!s)return false;const al=TEAM_EN[s.toLowerCase()];if(!al)return false;return al.some(x=>normStr(x)===normStr(a));}
function outcome(h,a){return h>a?'H':a>h?'A':'D';}
function calcPoints(th,ta,rh,ra){if(th===rh&&ta===ra)return 25;const dh=Math.abs(th-rh),da=Math.abs(ta-ra),ok=outcome(th,ta)===outcome(rh,ra);return Math.max(0,ok?20-dh-da:10-dh-da);}
function mapApiToResults(apiMatches){const res=new Array(M.length).fill(null);apiMatches.forEach(am=>{const idx=M.findIndex(m=>teamMatches(am.homeTeam.name,m.h)&&teamMatches(am.awayTeam.name,m.b));if(idx===-1)return;res[idx]={h:am.score.fullTime.home,a:am.score.fullTime.away,status:am.status};});return res;}

let RESULTS = [];

function updateMatchColors() {
    M.forEach((_, i) => {
        const r   = RESULTS[i];
        const row = document.getElementById('mr' + i);
        const h   = parseInt(document.getElementById('h'+i)?.value);
        const a   = parseInt(document.getElementById('a'+i)?.value);
        const res = document.getElementById('res' + i);
        if (!row || !res) return;
        if (!r || r.h == null) { row.className = 'm'; res.textContent = ''; res.className = 'mres'; return; }
        const isLive = r.status !== 'FINISHED';
        res.className = 'mres' + (isLive ? ' mres-live' : '');
        res.innerHTML = isLive
            ? `<span class="live-dot"></span>${r.h}–${r.a} LIVE`
            : `${r.h}–${r.a} FT`;
        if (!isNaN(h) && !isNaN(a)) {
            const p = calcPoints(h, a, r.h, r.a);
            const ptEl = document.getElementById('pt' + i);
            if (ptEl) ptEl.textContent = p + 'p';
            const hEl = document.getElementById('h'+i), aEl = document.getElementById('a'+i);
            if (h===r.h&&a===r.a)      { row.className='m m-x'; [hEl,aEl].forEach(e=>{if(e){e.classList.remove('gi-ok','gi-ng');e.classList.add('gi-x');}}); }
            else if (outcome(h,a)===outcome(r.h,r.a)) { row.className='m m-ok'; [hEl,aEl].forEach(e=>{if(e){e.classList.remove('gi-x','gi-ng');e.classList.add('gi-ok');}}); }
            else { row.className='m m-ng'; [hEl,aEl].forEach(e=>{if(e){e.classList.remove('gi-x','gi-ok');e.classList.add('gi-ng');}}); }
        } else { row.className = 'm'; }
        let total = 0, counted = 0;
        M.forEach((_, j) => {
            const rj = RESULTS[j]; if(!rj||rj.h==null||rj.status!=='FINISHED') return;
            const hj=parseInt(document.getElementById('h'+j)?.value), aj=parseInt(document.getElementById('a'+j)?.value);
            if(isNaN(hj)||isNaN(aj)) return;
            total += calcPoints(hj,aj,rj.h,rj.a); counted++;
        });
        const totalEl = document.getElementById('total-pts');
        if (totalEl && counted > 0) {
            totalEl.textContent = total + ' poäng';
            totalEl.style.display = 'inline-block';
            totalEl.style.background = total > counted * 15 ? '#d4edda' : '';
        } else if (totalEl) {
            totalEl.style.display = 'none';
        }
    });
}

// ─── ROUTING ─────────────────────────────────────────────────────────────────
const _params   = new URLSearchParams(location.search);
const kupongId  = _params.get('k');
const groupId   = _params.get('g') || null;
const DEFAULT_GROUP = 'joakim';

function col(name)     { return db.collection('groups').doc(groupId||DEFAULT_GROUP).collection(name); }
function metaDoc(name) { return db.collection('groups').doc(groupId||DEFAULT_GROUP).collection('meta').doc(name); }
function resultsDoc()  { return db.collection('meta').doc('results'); }

const _tabelHref = 'tabell/' + (groupId ? '?g=' + encodeURIComponent(groupId) : '');
document.querySelectorAll('#pub-tabell-link,#part-tabell-link').forEach(a => a.href = _tabelHref);
if (groupId) {
    const adminLink = document.getElementById('pub-admin-link');
    if (adminLink) adminLink.href = 'admin/?g=' + encodeURIComponent(groupId);
    const backLink = document.getElementById('part-back-link');
    if (backLink) backLink.href = './?g=' + encodeURIComponent(groupId);
}

if (kupongId) {
    document.getElementById('participant-page').style.display = 'block';
    initParticipant();
} else {
    document.getElementById('public-page').style.display = 'block';
    initPublic();
}

// ─── PUBLIC ───────────────────────────────────────────────────────────────────

async function initPublic() {
    if (!db) {
        document.getElementById('create-card').style.display = 'block';
        return;
    }
    try {
        const snap = await metaDoc('config').get();
        const closed = !!(snap.exists && snap.data()?.registrationClosed);
        if (closed) {
            document.getElementById('closed-card').style.display = 'block';
        } else {
            document.getElementById('create-card').style.display = 'block';
        }
    } catch(e) {
        document.getElementById('create-card').style.display = 'block';
    }
}

function genId() { return Math.random().toString(36).substr(2, 8); }

async function createLink() {
    const name = document.getElementById('new-name').value.trim();
    const id   = genId();
    const url  = location.origin + location.pathname + '?k=' + id + '&g=' + encodeURIComponent(groupId || DEFAULT_GROUP);
    if (db) {
        try {
            await col('kuponger').doc(id).set({
                label: name, namn: name, alias: '', email: '', tips: [],
                createdAt: new Date().toISOString()
            });
        } catch(e) {}
    }
    location.href = url;
}

// ─── PARTICIPANT ──────────────────────────────────────────────────────────────

let saveTimer = null;
let klarStatus = false;

function toggleKlar() {
    klarStatus = !klarStatus;
    updateKlarBtn();
    if (db) col('kuponger').doc(kupongId).update({ klar: klarStatus }).catch(() => {});
}

function updateKlarBtn() {
    const btn = document.getElementById('klar-btn');
    if (!btn) return;
    btn.textContent = klarStatus ? '✓ Klar' : 'Markera som klar';
    btn.style.color = klarStatus ? '#fff' : '';
    btn.style.background = klarStatus ? '#22a349' : '';
    const locked = klarStatus;
    document.querySelectorAll('#fn,#fa,#fe,.gi').forEach(el => {
        el.disabled = locked;
        el.style.opacity = locked ? '0.5' : '';
    });
}

function initParticipant() {
    render();
    if (db) {
        col('kuponger').doc(kupongId)
            .onSnapshot({ includeMetadataChanges: true }, snap => {
                if (snap.metadata.hasPendingWrites) return;
                if (snap.exists) applyState(snap.data());
            }, () => {
                try { applyState(JSON.parse(localStorage.getItem('vmt26_' + kupongId))); } catch(e) {}
            });
        resultsDoc().onSnapshot(snap => {
            if (snap.exists) { RESULTS = snap.data().results || []; updateMatchColors(); }
        });
        startResultsRefresh();
        return;
    }
    try { applyState(JSON.parse(localStorage.getItem('vmt26_' + kupongId))); } catch(e) {}
}

async function startResultsRefresh() {
    if (!db) return;
    try {
        const [gSnap, rSnap] = await Promise.all([
            metaDoc('config').get().catch(() => null),
            db.collection('meta').doc('config').get().catch(() => null)
        ]);
        const key = gSnap?.data()?.fdApiKey || rSnap?.data()?.fdApiKey;
        if (!key) return;
        const schedule = async () => {
            const wait = msUntilNextActivity();
            if (wait > 0) { setTimeout(schedule, Math.min(wait, 3600000)); return; }
            const interval = anyMatchLive() ? 60000 : 300000;
            try {
                const rsnap = await resultsDoc().get();
                const age = rsnap.exists ? Date.now() - new Date(rsnap.data().updatedAt).getTime() : Infinity;
                if (age > interval * 0.8) {
                    const apiUrl = 'https://api.football-data.org/v4/competitions/WC/matches';
                    const resp = await fetch('https://corsproxy.io/?' + encodeURIComponent(apiUrl), { headers: { 'X-Auth-Token': key } });
                    if (resp.ok) { const data = await resp.json(); const results = mapApiToResults(data.matches||[]); await resultsDoc().set({ results, updatedAt: new Date().toISOString() }); }
                }
            } catch(e) {}
            setTimeout(schedule, interval);
        };
        schedule();
    } catch(e) {}
}

function getState() {
    return {
        namn:  document.getElementById('fn').value,
        alias: document.getElementById('fa').value,
        email: document.getElementById('fe').value,
        tips:  M.map((_, i) => ({
            h: document.getElementById('h'+i)?.value ?? '',
            a: document.getElementById('a'+i)?.value ?? ''
        }))
    };
}

function applyState(s) {
    if (!s) return;
    if (s.namn)  document.getElementById('fn').value = s.namn;
    if (s.alias) document.getElementById('fa').value = s.alias;
    if (s.email) document.getElementById('fe').value = s.email;
    if (s.tips) s.tips.forEach((t, i) => {
        const h = typeof t === 'object' && !Array.isArray(t) ? t.h : t[0];
        const a = typeof t === 'object' && !Array.isArray(t) ? t.a : t[1];
        const he = document.getElementById('h'+i);
        const ae = document.getElementById('a'+i);
        if (he && h !== '' && h != null) { he.value = h; he.classList.add('ok'); }
        if (ae && a !== '' && a != null) { ae.value = a; ae.classList.add('ok'); }
    });
    if (s.klar !== undefined) { klarStatus = !!s.klar; updateKlarBtn(); }
    updateProg();
    updateMatchColors();
}

function save() {
    try { localStorage.setItem('vmt26_' + kupongId, JSON.stringify(getState())); } catch(e) {}
    updateProg();
    clearTimeout(saveTimer);
    setSaveSt('Sparar...');
    saveTimer = setTimeout(cloudSave, 1500);
}

async function cloudSave() {
    if (!db) { setSaveSt(''); return; }
    try {
        await col('kuponger').doc(kupongId).update(getState());
        setSaveSt('Sparad ✓');
        setTimeout(() => setSaveSt(''), 3000);
    } catch(e) { setSaveSt(''); }
}

function setSaveSt(msg) { const el=document.getElementById('save-st'); if(el) el.textContent=msg; }

function updateProg() {
    let n = 0;
    M.forEach((_, i) => {
        if (document.getElementById('h'+i)?.value !== '' && document.getElementById('a'+i)?.value !== '') n++;
    });
    document.getElementById('prog').textContent = n + ' / 72';
}

function render() {
    const el = document.getElementById('ml');
    let grp = null, n = 0;
    M.forEach((m, i) => {
        if (m.g !== grp) {
            grp = m.g;
            const g = document.createElement('div');
            g.className = 'gh'; g.textContent = m.g;
            el.appendChild(g);
        }
        n++;
        const d = document.createElement('div');
        d.className = 'm'; d.id = 'mr' + i;
        d.innerHTML = `<div class="mn"><b>#${n}</b>${m.t}<span class="mres" id="res${i}"></span></div>
            <div class="th">${m.h}</div>
            <div class="sc">
                <input class="gi" type="number" min="0" max="20" id="h${i}" placeholder="?">
                <span class="dash">–</span>
                <input class="gi" type="number" min="0" max="20" id="a${i}" placeholder="?">
            </div>
            <div class="ta">${m.b}</div>
            <div class="mp" id="pt${i}"></div>`;
        el.appendChild(d);
    });
    M.forEach((_, i) => {
        ['h','a'].forEach(p => {
            const inp = document.getElementById(p+i);
            inp.addEventListener('input', () => { inp.classList.toggle('ok', inp.value !== ''); save(); });
        });
    });
}

// ─── EXCEL ────────────────────────────────────────────────────────────────────

function dlXlsx() {
    if (typeof XLSX === 'undefined') { toast('Laddar... försök igen om ett ögonblick'); return; }
    const s = getState();
    const wb = XLSX.utils.book_new();
    const ws = { '!ref': 'A1:K73' };
    const S = v => ({ v, t: 's' });
    ws['A1']=S('Datum'); ws['B1']=S('Tid'); ws['C1']=S('Hemmalag'); ws['D1']=S('Bortalag');
    ws['E1']=S('Grupp'); ws['G1']=S('Hemmamål'); ws['H1']=S('Bortamål');
    ws['J1']=S('Namn');   ws['K1']=S(s.namn);
    ws['J2']=S('Alias');  ws['K2']=S(s.alias);
    ws['J3']=S('E-mail'); ws['K3']=S(s.email);
    M.forEach((m, i) => {
        const row = m.r;
        if (i === 0 || M[i-1].d !== m.d) ws['A'+row] = S(m.d);
        ws['B'+row]=S(m.t); ws['C'+row]=S(m.h); ws['D'+row]=S(m.b); ws['E'+row]=S(m.g);
        const t = s.tips[i];
        const hv = typeof t === 'object' && !Array.isArray(t) ? t.h : t[0];
        const av = typeof t === 'object' && !Array.isArray(t) ? t.a : t[1];
        if (hv !== '') ws['G'+row] = { v: parseInt(hv,10), t:'n' };
        if (av !== '') ws['H'+row] = { v: parseInt(av,10), t:'n' };
    });
    XLSX.utils.book_append_sheet(wb, ws, 'Blad1');
    const fn = (s.alias||s.namn||'tips').replace(/[^\wåäöÅÄÖ]/g,'_') + '_VM2026.xlsx';
    XLSX.writeFile(wb, fn);
    toast('Excel-filen laddas ner...');
}

function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),2500); }

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
